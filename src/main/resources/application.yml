spring:
  datasource:
    url: jdbc:h2:mem:facturacion;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
facturacion:
  iva-por-defecto: 21
  usuario-por-defecto: sistema
  # Los precios de lista están en pesos. Cotizaciones: pesos que vale una unidad de cada moneda.
  moneda-base: PES
  cotizaciones:
    PES: 1
    DOL: 1550
  cors:
    # Orígenes del frontend local que pueden leer la API desde un navegador (no es autenticación).
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
      - http://127.0.0.1:5173
      - http://127.0.0.1:3000
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/facturacion
    driver-class-name: org.postgresql.Driver
    username: facturacion
    password: facturacion
  h2:
    console:
      enabled: false
