spring:
  datasource:
    url: jdbc:h2:mem:facturacion;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/facturacion
    driver-class-name: org.postgresql.Driver
    username: facturacion
    password: facturacion
  h2:
    console:
      enabled: false
