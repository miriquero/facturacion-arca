plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'ar.edu.utn.frm'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'com.github.librepdf:openpdf:2.0.3'
    implementation 'org.apache.poi:poi-ooxml:5.3.0'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.87'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// javac no genera package-info.class para descriptores que solo tienen Javadoc;
// -Xpkginfo:always los emite para que cada paquete exista en el classpath.
tasks.named('compileJava') {
    options.compilerArgs << '-Xpkginfo:always'
}

// Zona horaria fija (DD-12): el driver JDBC de PostgreSQL envia la zona por defecto de la JVM al conectar.
def zonaHoraria = 'America/Argentina/Buenos_Aires'

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'user.timezone', zonaHoraria
}

tasks.named('bootRun') {
    jvmArgs "-Duser.timezone=${zonaHoraria}"
}

tasks.register('probarWsaa', JavaExec) {
    group = 'verification'
    description = 'Solicita un ticket para wsfe en WSAA de homologación.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ar.edu.utn.frm.facturacion.arca.PruebaWsaa'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

tasks.register('probarWsfe', JavaExec) {
    group = 'verification'
    description = 'Consulta el último comprobante C autorizado en homologación, sin emitir.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'ar.edu.utn.frm.facturacion.arca.PruebaWsaa'
    javaLauncher = javaToolchains.launcherFor(java.toolchain)
    args 'wsfe'
}

// Evita generar facturacion-arca-1.0.0-plain.jar: build/libs/ solo contiene el JAR ejecutable.
tasks.named('jar') {
    enabled = false
}

// Suite de concurrencia contra PostgreSQL, a demanda (no se engancha a test, check ni build: la corrida normal no
// necesita ningun servidor). Requiere el PostgreSQL local (por defecto el portatil en el puerto 5433):
//   ./gradlew testPostgres            (opcional: -PpostgresUrl=jdbc:postgresql://localhost:5433/facturacion)
// El reporte queda separado en build/reports/tests/testPostgres.
tasks.register('testPostgres', Test) {
    group = 'verification'
    description = 'Corre la suite de concurrencia (tag concurrencia) contra PostgreSQL en el puerto 5433.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'concurrencia'
    }
    systemProperty 'user.timezone', zonaHoraria
    systemProperty 'facturacion.pruebas.motor', 'postgres'
    systemProperty 'facturacion.pruebas.postgres-url',
            (findProperty('postgresUrl') ?: 'jdbc:postgresql://localhost:5433/facturacion').toString()
    testLogging {
        showStandardStreams = true
        events 'passed', 'failed', 'skipped'
    }
}
